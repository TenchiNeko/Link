name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q link.py link_core link_modes factory tests

      - name: Run smoke suites
        run: make test

      - name: Lint fatal errors
        run: make lint

      - name: Type-check stable entrypoint
        run: make typecheck
